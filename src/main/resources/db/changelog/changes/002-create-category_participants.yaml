databaseChangeLog:
  - changeSet:
      id: 002
      author: olena
      preConditions:
        - onFail: MARK_RAN
        - not:
            - or:
                - tableExists:
                    tableName: category_participants
      changes:
        - createTable:
            tableName: category_participants
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: name_category
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: age
                  type: INTEGER
              - column:
                  name: ageon
                  type: INTEGER
      rollback:
        - delete:
            tableName: category_participants