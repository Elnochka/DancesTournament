databaseChangeLog:
  - changeSet:
      id: 037
      author: olena
      changes:
        - createTable:
            tableName: active_dance_state
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: category_tournament_id
                  type: BIGINT

              - column:
                  name: round_settings_id
                  type: BIGINT

              - column:
                  name: dance_id
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: active_dance_state
            baseColumnNames: category_tournament_id
            referencedTableName: category_tournaments
            referencedColumnNames: id
            constraintName: fk_active_dance_category

        - addForeignKeyConstraint:
            baseTableName: active_dance_state
            baseColumnNames: round_settings_id
            referencedTableName: round_settings
            referencedColumnNames: id
            constraintName: fk_active_dance_round_settings

        - addForeignKeyConstraint:
            baseTableName: active_dance_state
            baseColumnNames: dance_id
            referencedTableName: dances
            referencedColumnNames: id
            constraintName: fk_active_dance_dance

        - insert:
            tableName: active_dance_state
            columns:
              - column:
                  name: id
                  valueNumeric: 1

      rollback:
        - dropTable:
            tableName: active_dance_state