databaseChangeLog:
  - changeSet:
      id: 034
      author: olena
      changes:
        - createTable:
            tableName: couple_history
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: couple_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: male_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: female_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  defaultValueComputed: "CURRENT_DATE"
              - column:
                  name: end_date
                  type: DATE
        - addForeignKeyConstraint:
            baseTableName: couple_history
            baseColumnNames: couple_id
            referencedTableName: couples
            referencedColumnNames: id
            constraintName: fk_ch_couple
        - addForeignKeyConstraint:
            baseTableName: couple_history
            baseColumnNames: male_id
            referencedTableName: participants
            referencedColumnNames: id
            constraintName: fk_ch_male
        - addForeignKeyConstraint:
            baseTableName: couple_history
            baseColumnNames: female_id
            referencedTableName: participants
            referencedColumnNames: id
            constraintName: fk_ch_female
      rollback:
        - dropTable:
            tableName: couple_history