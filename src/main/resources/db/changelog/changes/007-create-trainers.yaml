databaseChangeLog:
  - changeSet:
      id: 007
      author: olena
      preConditions:
        - onFail: MARK_RAN
        - not:
            - or:
                - tableExists:
                    tableName: trainers
      changes:
        - createTable:
            tableName: trainers
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name_trainer
                  type: VARCHAR(255)
              - column:
                  name: club_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: category_judge_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: organization_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: city_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: country_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: date_club
                  type: DATE

        - addForeignKeyConstraint:
            baseTableName: trainers
            baseColumnNames: club_id
            referencedTableName: clubs
            referencedColumnNames: id
            constraintName: fk_trainers_clubs

        - addForeignKeyConstraint:
            baseTableName: trainers
            baseColumnNames: category_judge_id
            referencedTableName: category_judges
            referencedColumnNames: id
            constraintName: fk_trainers_category_judges

        - addForeignKeyConstraint:
            baseTableName: trainers
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_trainers_organizations

        - addForeignKeyConstraint:
            baseTableName: trainers
            baseColumnNames: city_id
            referencedTableName: cities
            referencedColumnNames: id
            constraintName: fk_trainers_cities

        - addForeignKeyConstraint:
            baseTableName: trainers
            baseColumnNames: country_id
            referencedTableName: countries
            referencedColumnNames: id
            constraintName: fk_trainers_countries
      rollback:
        - delete:
            tableName: trainers