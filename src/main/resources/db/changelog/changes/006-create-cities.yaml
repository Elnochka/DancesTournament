databaseChangeLog:
  - changeSet:
      id: 006
      author: olena
      preConditions:
        - onFail: MARK_RAN
        - not:
            - or:
                - tableExists:
                    tableName: cities
      changes:
        - createTable:
            tableName: cities
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: name_city
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
      rollback:
        - delete:
            tableName: cities