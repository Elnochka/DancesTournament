databaseChangeLog:
  - changeSet:
      id: 033
      author: olena
      changes:
        - createTable:
            tableName: participant_trainer_history
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: participant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: trainer_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  defaultValueComputed: "CURRENT_DATE"
              - column:
                  name: end_date
                  type: DATE
        - addForeignKeyConstraint:
            baseTableName: participant_trainer_history
            baseColumnNames: participant_id
            referencedTableName: participants
            referencedColumnNames: id
            constraintName: fk_pth_participant
        - addForeignKeyConstraint:
            baseTableName: participant_trainer_history
            baseColumnNames: trainer_id
            referencedTableName: trainers
            referencedColumnNames: id
            constraintName: fk_pth_trainer
      rollback:
        - dropTable:
            tableName: participant_trainer_history