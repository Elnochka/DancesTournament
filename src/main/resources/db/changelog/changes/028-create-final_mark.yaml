databaseChangeLog:
  - changeSet:
      id: create-final-mark-table
      author: olena
      changes:
        - createTable:
            tableName: final_mark
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: participant_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: judge_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: dance_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: place
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: is_locked
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: updated_at
                  type: timestamp

        # Foreign keys
        - addForeignKeyConstraint:
            baseTableName: final_mark
            baseColumnNames: participant_id
            constraintName: fk_final_mark_participant_tournament
            referencedTableName: participant_tournaments
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: final_mark
            baseColumnNames: category_id
            constraintName: fk_final_mark_category
            referencedTableName: category_tournaments
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: final_mark
            baseColumnNames: judge_id
            constraintName: fk_final_mark_judge
            referencedTableName: judges
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: final_mark
            baseColumnNames: dance_id
            constraintName: fk_final_mark_dance
            referencedTableName: dances
            referencedColumnNames: id

        # Indexes
        - createIndex:
            indexName: idx_final_mark_category
            tableName: final_mark
            columns:
              - column:
                  name: category_id

        - createIndex:
            indexName: idx_final_mark_participant_tournament
            tableName: final_mark
            columns:
              - column:
                  name: participant_id

        - createIndex:
            indexName: idx_final_mark_judge
            tableName: final_mark
            columns:
              - column:
                  name: judge_id

        - createIndex:
            indexName: idx_final_mark_dance
            tableName: final_mark
            columns:
              - column:
                  name: dance_id