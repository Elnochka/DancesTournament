databaseChangeLog:
  - changeSet:
      id: 005
      author: olena
      preConditions:
        - onFail: MARK_RAN
        - not:
            - or:
                - tableExists:
                    tableName: clubs
      changes:
        - createTable:
            tableName: clubs
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: name_club
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
      rollback:
        - delete:
            tableName: clubs